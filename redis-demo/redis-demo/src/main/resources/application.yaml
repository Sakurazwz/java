spring:
  application:
    name: redis-demo

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 缓存过期时间：10分钟
      cache-null-values: false
      use-key-prefix: true

# 服务器端口
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    com.example.redisdemo: DEBUG

# Swagger 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
