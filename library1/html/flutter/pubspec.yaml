name: library1_flutter
description: 图书管理系统 Flutter 客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # 网络请求
  dio: ^5.4.0

  # 路由
  go_router: ^13.0.0

  # 本地存储
  shared_preferences: ^2.2.2

  # UI 组件
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # 工具
  intl: ^0.19.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
