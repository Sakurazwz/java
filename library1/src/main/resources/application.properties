# 1. PostgreSQL 配置（从环境变量读取，避免硬编码）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/book_library}
spring.datasource.username=${DB_USERNAME:admin_user}
spring.datasource.password=${DB_PASSWORD:DI-624+a}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA/Hibernate 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.application.name=library1

# JWT 配置（密钥从环境变量读取，生产环境必须修改）
app.security.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-change-me}
app.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# 管理员默认账户（首次启动自动创建）
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# 文件上传限制（支持 Base64 图片传输）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
